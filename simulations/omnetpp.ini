[General]
network = chronosnr.src.ChronosNRNetwork
sim-time-limit = 5s
**.numUsers = 5
**.numPRBs = 10
**.embbScheduler.schedulingPolicy = "WRR"

# Moderate eMBB load (some PRBs free, some occupied)
**.embbUser[*].gen.interArrivalTime = exponential(0.65ms)
# Small URLLC traffic (arrives asynchronously and uses 0.1ms minislot cycle)
**.urllcUser.gen.interArrivalTime = exponential(0.8ms)

[Config HeavyPuncturing]
description = "All 10 PRBs occupied by eMBB -> URLLC overwrites eMBB and triggers high-priority retransmissions"
**.embbUser[*].gen.interArrivalTime = exponential(0.42ms)
**.urllcUser.gen.interArrivalTime = exponential(0.45ms)

[Config LoadAndPolicySweep]
description = "Sweeps network load (30%, 50%, 70%, 90%) across WRR, PF, MAX_CI, and RR"
**.embbScheduler.schedulingPolicy = ${policy="WRR", "PF", "MAX_CI", "RR"}
**.embbUser[*].gen.interArrivalTime = exponential(${iat=1.66ms, 1.0ms, 0.71ms, 0.55ms})
**.urllcUser.gen.interArrivalTime = exponential(0.6ms)
